services:
  web:
    build:
      context: ./web_picture_studio
      dockerfile: Dockerfile
    container_name: studio-picture-web
    ports:
      - "3001:3000"
    environment:
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-localhost}
      - PORTRAIT_GRPC_URL=http://envoy:8080
      - PORTRAIT_GRPC_TRANSPORT=grpc-web
      - PORTRAIT_GRPC_TOKEN=${PORTRAIT_GRPC_TOKEN:-}
      - PORTRAIT_GRPC_TIMEOUT_MS=${PORTRAIT_GRPC_TIMEOUT_MS:-60000}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - envoy
    restart: unless-stopped

  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.32.13}
    container_name: studio-picture-envoy
    volumes:
      - ./web_picture_studio/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - portrait
    restart: unless-stopped

  portrait:
    build: ./grcp_worker_remove_bg
    image: portrait-service:latest
    container_name: portrait-service
    ports:
      - "50051:50051"
    environment:
      - PORTRAIT_HOST=0.0.0.0
      - PORTRAIT_PORT=50051
      - LOCAL_SEGMENTATION_ENABLED=${LOCAL_SEGMENTATION_ENABLED:-true}
      - LOCAL_SEGMENTATION_MODEL=${LOCAL_SEGMENTATION_MODEL:-isnet-general-use}
      - ONNX_SEGMENTATION_ENABLED=${ONNX_SEGMENTATION_ENABLED:-true}
      - ONNX_MODEL_DTYPE=${ONNX_MODEL_DTYPE:-fp32}
      - ONNX_MODEL_CACHE_DIR=/models
      - ONNX_EXECUTION_PROVIDERS=${ONNX_EXECUTION_PROVIDERS:-CPUExecutionProvider}
      - ONNX_MODEL_WARMUP=${ONNX_MODEL_WARMUP:-true}
      - AI_PROVIDERS_ORDER=${AI_PROVIDERS_ORDER:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-60}
      - AI_REMOVEBG_API_KEY=${AI_REMOVEBG_API_KEY:-}
      - AI_CLIPDROP_API_KEY=${AI_CLIPDROP_API_KEY:-}
      - MAX_DIMENSION_LIMIT=${MAX_DIMENSION_LIMIT:-4096}
      - ALPHA_FEATHER=${ALPHA_FEATHER:-0}
      - JPEG_QUALITY=${JPEG_QUALITY:-90}
      - BEAUTY_STRENGTH=${BEAUTY_STRENGTH:-35}
      - GRPC_MAX_MESSAGE_SIZE=${GRPC_MAX_MESSAGE_SIZE:-67108864}
    volumes:
      - ${AI_MODELS_SOURCE:-rembg-models}:/models
    restart: unless-stopped


volumes:
  rembg-models:
