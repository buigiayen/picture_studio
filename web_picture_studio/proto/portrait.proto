syntax = "proto3";

package portrait;

service PortraitService {
  rpc ChangeBackground(ChangeBackgroundRequest) returns (ChangeBackgroundResponse);
  rpc Ping(Empty) returns (Pong);
  rpc GetProviders(Empty) returns (ProviderList);
}

message Empty {}

message Pong {
  string message = 1;
}

message Color {
  int32 red = 1;
  int32 green = 2;
  int32 blue = 3;
  int32 alpha = 4;
}

message ChangeBackgroundRequest {
  bytes image = 1;
  Color background_color = 2;
  string image_name = 3;
  string output_format = 4;
  int32 max_dimension = 5;
  int32 sharpness = 6;
  optional int32 beauty_strength = 7;
}

message ChangeBackgroundResponse {
  bytes image = 1;
  string image_name = 2;
  string output_format = 3;
  string provider_used = 4;
  double latency_ms = 5;
  int32 width = 6;
  int32 height = 7;
}

message ProviderList {
  repeated string providers = 1;
}
